[project]
name = "RCTab"
version = "1.12.0"
description = "The RCTab API. Manage Azure budgets and usage"
authors = []
dynamic = [ "dependencies" ]
requires-python = ">=3.14, <3.15"
dependencies = [
    "alembic (>=1.16.3,<2.0.0)",
    "anyio (>=4.9.0,<5.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "azure-identity (>=1.23.0,<2.0.0)",
    "azure-monitor-opentelemetry (>=1.8.10,<2.0.0)",
    "celery (>=5.5.3,<6.0.0)",
    "fastapi>=0.165.0,<0.166.0",
    "fastapimsal @ git+https://git@github.com/alan-turing-institute/fastapimsal@0.12.0",
    "jinja2 (>=3.1.6,<4.0.0)",
    "numpy (>=1.26.4,<2.0.0)",
    "pandas (>=2.0.0,<3.0.0)",
    "plotly (>=5.24.1,<6.0.0)",
    "psycopg2-binary (>=2.9.10,<3.0.0)",
    "pydantic[email] (>=2.11.7,<3.0.0)",
    "pydantic-settings (>=2.10.1,<3.0.0)",
    "pyjwt (>=2.10.1,<3.0.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "rctab-models @ git+https://git@github.com/alan-turing-institute/rctab-models@0.4.0",
    "redis (>=6.4.0,<9.0.0)",
    "requests (>=2.32.4,<3.0.0)",
    "secure (>=0.3.0,<0.4.0)",
    "sendgrid (>=6.12.4,<7.0.0)",
    "sqlalchemy[asyncio] (>=2.0.41,<3.0.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "psycopg (>=3.3.8,<4.0.0)"
]

[tool.poetry]
# Oldest Poetry that may work on this project.
# Bump it by hand when we need a newer Poetry feature.
requires-poetry = ">=2.4"

[tool.poetry.group.dev.dependencies]
black = "^26.3.1"
devtools = { extras = ["pygments"], version = "^0.13.0" }
flake8 = "^7.3.0"
genbadge = "^1.1.1"
httpie = "^3.2.3"
httpie-jwt-auth = "^0.4.0"
httpx = "^0.28.1"
hypothesis = "^6.82.6"
ipykernel = "^6.19.4"
isort = "^9.0.0"
mypy = "^2.1.0"
pre-commit = "^4.2.0"
pydocstyle = "^6.3.0"
pylint = "^4.1.3"
flake8-absolute-import = "^1.0.0.3"
pymarkdownlnt = "^0.9.6"
pytest = "^9.2.0"
pytest-asyncio = "^1.4.0"
pytest-cov = "^7.1.0"
pytest-mock = "^3.15.1"
types-requests = "^2.32.0.20240602"
pyre-check = "^0.10.0"
coverage = "^7.9.2"

[project.optional-dependencies]
docs = [
    "sphinx (>=9.2.0,<10.0.0)",
    "sphinx-rtd-theme (>=3.1.0,<4.0.0)",
    "myst-parser (>=5.2.0,<6.0.0)",
]

[tool.isort]
profile = "black"

[tool.black]
line-length = 88

[tool.coverage.run]
# Relative paths so python-coverage-comment-action can build the badge/comment.
relative_files = true

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
