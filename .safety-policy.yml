version: '3.0'

scanning-settings:
  max-depth: 1
  exclude: [".venv"]
  include-files: []
  system:
    targets: []


report:
  dependency-vulnerabilities:
    enabled: true
    auto-ignore-in-report:
      python:
        environment-results: true
        unpinned-requirements: true
      cvss-severity: []
      vulnerabilities:
        64459:
          reason: Python wide vulnerability.
          expires: '2027-05-04'
        64396:
          reason: Python wide vulnerability.
          expires: '2027-05-04'


fail-scan-with-exit-code:
  dependency-vulnerabilities:
    enabled: true
    fail-on-any-of:
      cvss-severity:
        - medium
        - critical
        - high
      exploitability:
        - medium
        - critical
        - high

security-updates:
  dependency-vulnerabilities:
    auto-security-updates-limit:
      - patch
