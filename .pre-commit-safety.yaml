# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: local
    hooks:
      - id: safety
        name: Safety
        # Runs in its own environment so that safety's dependencies (e.g. its
        # filelock<4 pin) don't end up in, and get reported against, ours
        entry: safety --stage cicd scan --policy-file .safety-policy.yml
        pass_filenames: false
        language: python
        additional_dependencies: ["safety==3.8.1"]
